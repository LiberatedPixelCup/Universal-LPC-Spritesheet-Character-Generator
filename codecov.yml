coverage:
  status:
    project: false
    patch:
      default:
        target: 100%
        threshold: 0%
        only_pulls: true
        if_not_found: success
        # Comment/blank lines are marked hit in uploaded lcov so documentation-only
        # diffs do not fail this 100% patch gate. See mark-non-executable-lines.js.
    changes:
      default:
        if_not_found: success

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: true

ignore:
  - tests/**
  - dist/**
  - spritesheets/**
  - sheet_definitions/**
  - scripts/coverage/**
  - scripts/computed-style/**
  - scripts/imageProcessing/**
  - scripts/zip/**
  - scripts/fixture-builder.ts
  - scripts/generate-purgecss-safelist-hints.ts
  - scripts/issue382-golden-playwright.ts
  - scripts/update_sheet_definitions.ts
  - scripts/generateSources/source_inputs_fingerprint.ts
  - vite/**
  - vite.config.js
  - testem.cjs
  - sources/performance-profiler.ts
  - sources/utils/debug.ts
  - "**/*.css"
  - "**/*.scss"

flags:
  node:
    paths:
      - scripts/
  browser:
    paths:
      - sources/
