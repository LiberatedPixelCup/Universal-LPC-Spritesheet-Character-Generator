<!DOCTYPE html>
<html lang="en-us" data-theme="light">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Open Spritesheet</title>
</head>
<body>
	<header id="header-left" class="lpc-header">
		<div class="lpc-header-inner">
			<div class="lpc-header-brand">
				<h1 class="title lpc-app-title">
					<span>Open Spritesheet</span>
					<a href="https://github.com/teakay1311/OpenSpritesheet" class="lpc-github-link">
						<img src="sources/github-mark.png" alt="View on GitHub" width="24" height="24" class="lpc-github-mark">
					</a>
				</h1>
				<p class="lpc-header-tagline">
					Free/Libre pixel art from the <a href="https://lpc.opengameart.org">Liberated Pixel Cup</a>
					<span class="lpc-sep" aria-hidden="true">·</span>
					You must <a href="#credits-section">credit the authors</a>
				</p>
			</div>
			<div id="sponsors-links" class="lpc-header-links">
				<a href="https://www.netlify.com/">Site previews by Netlify</a>
				<span class="lpc-sep" aria-hidden="true">·</span>
				<a href="https://argos-ci.com?utm_source=LiberatedPixelCup&utm_campaign=oss">Visual testing by Argos</a>
			</div>
		</div>
	</header>

	<main id="columns-container" class="lpc-main">
		<div class="lpc-workbench">
			<div id="mithril-preview" class="lpc-animation-slot">
				<div class="box lpc-panel lpc-animation-panel loading-shell-animation">
					<span class="loading" aria-label="Loading animation preview"></span>
				</div>
			</div>
			<div id="chooser-column" class="lpc-chooser-column">
				<div id="mithril-filters">
					<div class="box lpc-panel loading-shell-filters">
						<div class="category-tree-loading-host">
							<span class="loading" aria-label="Loading filters"></span>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="mithril-spritesheet-preview" class="lpc-spritesheet-slot">
			<div class="box lpc-panel lpc-spritesheet-panel loading-shell-spritesheet">
				<span class="loading" aria-label="Loading spritesheet preview"></span>
			</div>
		</div>
	</main>
	<script type="module" src="sources/main.ts"></script>
</body>
</html>
