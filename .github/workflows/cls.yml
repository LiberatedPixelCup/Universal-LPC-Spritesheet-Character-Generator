name: CLS (Lighthouse)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  cls:
    name: CLS (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.1
        with:
          chrome-version: "latest"

      - name: Install Linux system fonts and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rsync \
            fonts-liberation \
            fonts-noto-color-emoji \
            fonts-noto-cjk \
            fonts-wqy-zenhei \
            fonts-dejavu \
            fonts-freefont-ttf

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Measure lab CLS
        run: npm run profile:cls -- --repeat 3
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload CLS profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cls-profile
          path: tmp/cls-profile.json
